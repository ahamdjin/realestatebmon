name: Build 100 FPS frame sequences
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Render interpolated WebP sequences
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/frames/scroll
          python3 - <<'PY'
          import json,subprocess,pathlib
          manifest={'scroll':{}}
          for i in range(8):
              source=f'assets/scroll/{i}.mp4'
              folder=pathlib.Path(f'assets/frames/scroll/{i}')
              folder.mkdir(parents=True,exist_ok=True)
              output=str(folder/'%04d.webp')
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',source,
                '-vf','minterpolate=fps=100:mi_mode=mci:mc_mode=obmc:me_mode=bidir,scale=1280:-2',
                '-vsync','cfr','-c:v','libwebp','-quality','62','-compression_level','4',output],check=True)
              files=list(folder.glob('*.webp'))
              if not files:raise RuntimeError(f'No frames rendered for {source}')
              manifest['scroll'][str(i)]={'count':len(files),'fps':100,'width':1280,'height':720}
              print(source,len(files),flush=True)
          pathlib.Path('assets/frames/manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Commit new frames to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/frames
          if ! git diff --cached --quiet; then
            git commit -m "Generate interpolated WebP frame sequences at 100 fps"
            git push
          fi
